name: JMeter Performance Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: apache-jmeter-5.6.3
          key: jmeter-5.6.3

      - name: Download JMeter (only if not cached)
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter Tests
        run: |
          mkdir -p results reports
          apache-jmeter-5.6.3/bin/jmeter.sh \
            -n \
            -t task1.jmx \
            -l results/results.jtl \
            -e \
            -o reports/

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: reports/

      - name: Upload JTL Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-jtl-results
          path: results/results.jtl